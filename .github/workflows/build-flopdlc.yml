name: Build FlopDLC.dylib

# Собирает FlopDLC.mm в инжектируемую библиотеку FlopDLC.dylib (iOS, arm64 + arm64e).
# Команда сборки взята из шапки FlopDLC.mm, добавлен только fat-бинарник и проверки.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-flopdlc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SRC: FlopDLC.mm
  OUT: FlopDLC.dylib
  IOS_MIN: '15.0'

jobs:
  build:
    name: Build dylib
    # macos-14 на этом аккаунте отменяется сразу после старта, macos-15 работает.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK version: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcrun --sdk iphoneos clang++ --version

      - name: Build FlopDLC.dylib
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          COMMON=(
            -isysroot "$SDK"
            -std=c++17
            -fobjc-arc
            -O2
            -fvisibility=hidden
            -dynamiclib
            -install_name @rpath/FlopDLC.dylib
            -Wl,-undefined,dynamic_lookup
            -Wl,-dead_strip
            -Wno-deprecated-declarations
            -framework Foundation
            -framework UIKit
            -framework CoreGraphics
            -framework CoreFoundation
            -framework QuartzCore
            -framework AVFoundation
          )

          for ARCH in arm64 arm64e; do
            echo "::group::clang++ $ARCH"
            if xcrun --sdk iphoneos clang++ \
                 -target "${ARCH}-apple-ios${IOS_MIN}" \
                 "${COMMON[@]}" \
                 "$SRC" -o "build/FlopDLC-${ARCH}.dylib"; then
              echo "ok: $ARCH"
            else
              echo "::warning::сборка под $ARCH не удалась, пробуем остальные слайсы"
              rm -f "build/FlopDLC-${ARCH}.dylib"
            fi
            echo "::endgroup::"
          done

          if [ ! -f build/FlopDLC-arm64.dylib ]; then
            echo "::error::arm64 слайс не собрался — это обязательная архитектура"
            exit 1
          fi

          if [ -f build/FlopDLC-arm64e.dylib ]; then
            lipo -create build/FlopDLC-arm64.dylib build/FlopDLC-arm64e.dylib -output "$OUT"
          else
            cp build/FlopDLC-arm64.dylib "$OUT"
          fi

      - name: Verify dylib
        run: |
          set -euo pipefail
          file "$OUT"
          lipo -info "$OUT"
          echo "--- linked libraries"
          otool -L "$OUT"
          echo "--- install name"
          otool -D "$OUT"
          echo "--- load commands"
          otool -l "$OUT" | grep -E "LC_BUILD_VERSION|platform|minos|sdk " | head -20 || true

          # Точка входа — __attribute__((constructor)): без неё библиотека бесполезна.
          if ! otool -l "$OUT" | grep -q "__mod_init_func"; then
            echo "::error::в dylib нет __mod_init_func — конструктор не попал в бинарник"
            exit 1
          fi
          echo "constructor section: ok"

          # Никаких неразрешённых символов, кроме ожидаемых динамических.
          nm -u "$OUT" | head -40 || true

          shasum -a 256 "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlopDLC-dylib
          path: |
            FlopDLC.dylib
            FlopDLC.dylib.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach dylib to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: FlopDLC-dylib

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" FlopDLC.dylib FlopDLC.dylib.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" FlopDLC.dylib FlopDLC.dylib.sha256 \
              --repo "$GITHUB_REPOSITORY" --generate-notes --title "FlopDLC $TAG"
          fi
